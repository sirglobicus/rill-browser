name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # only used when buildif.md also says release=yes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check buildif.md
        id: check
        run: |
          should_build=false
          release=false
          version=""
          if [ -f buildif.md ]; then
            grep -qiE '^[[:space:]]*build=yes[[:space:]]*$' buildif.md && should_build=true
            grep -qiE '^[[:space:]]*release=yes[[:space:]]*$' buildif.md && release=true
            # release=1.2.3 (or v1.2.3) publishes a release tagged v1.2.3
            v=$(grep -iE '^[[:space:]]*release=v?[0-9]+(\.[0-9]+)*([-+.][0-9A-Za-z.]+)?[[:space:]]*$' buildif.md | head -n1 \
              | sed -E 's/^[[:space:]]*[Rr][Ee][Ll][Ee][Aa][Ss][Ee]=v?//; s/[[:space:]]*$//' | tr -d '\r')
            if [ -n "$v" ]; then
              release=true
              version="$v"
            fi
          fi
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$should_build" != "true" ]; then
            echo "Build skipped (buildif.md is not build=yes)"
          fi

      - name: Set up JDK 17
        if: steps.check.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        if: steps.check.outputs.should_build == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        if: steps.check.outputs.should_build == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_B64 secret: APK will be signed with the debug key."
          fi

      - name: Make gradlew executable
        if: steps.check.outputs.should_build == 'true'
        run: chmod +x gradlew

      - name: Unit tests
        if: steps.check.outputs.should_build == 'true'
        run: ./gradlew testDebugUnitTest

      - name: Build release APKs
        if: steps.check.outputs.should_build == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION: ${{ steps.check.outputs.version }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          [ -z "$APP_VERSION" ] && unset APP_VERSION
          ./gradlew assembleRelease

      - name: Name the APK with the commit short SHA
        if: steps.check.outputs.should_build == 'true'
        run: |
          mkdir out
          name="rill-browser-${GITHUB_SHA::7}"
          [ -n "${{ steps.check.outputs.version }}" ] && name="rill-browser-v${{ steps.check.outputs.version }}"
          cp app/build/outputs/apk/release/*.apk "out/$name.apk"
          ls -la out

      - name: Upload APKs
        if: steps.check.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rill-browser-${{ github.sha }}
          path: out/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.check.outputs.should_build == 'true' && steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ steps.check.outputs.version }}" ]; then
            tag="v${{ steps.check.outputs.version }}"
          else
            tag="build-${GITHUB_SHA::7}"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists: replacing its APK."
            gh release upload "$tag" out/*.apk --clobber
          else
            gh release create "$tag" out/*.apk --target "$GITHUB_SHA" --title "Rill $tag" --notes "Automated build of $GITHUB_SHA" --latest
          fi
